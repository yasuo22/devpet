# DevPet CI 流水线
# devpet/ —— 纯静态 Web 应用（无构建步骤，Node 语法校验）
# tauri/  —— Tauri 2 桌面壳（Vite 前端构建 + Rust 后端编译）

"main":
  push:
    - name: devpet-build
      runner:
        cpus: 4
      docker:
        image: node:20
      # 密钥仓库（存放 GITHUB_SYNC_TOKEN 等敏感信息，勿把 token 直接写进配置）
      # 请在 CNB 新建「密钥仓库」DevPet-Secrets，并在其 main 分支 secrets.yml 中声明:
      #   GITHUB_SYNC_TOKEN: "<你的GitHub令牌>"
      imports:
        - https://cnb.cool/uzi999-2026/DevPet-Secrets/-/blob/main/secrets.yml
      stages:
        - name: install
          script: |
            set -e
            npm --prefix tauri install --no-audit --no-fund
        - name: syntax-check
          script: |
            set -e
            echo "==> 校验 devpet/ 静态模块 JS 语法"
            for f in devpet/js/*.js; do
              node --check "$f" || exit 1
            done
            echo "==> 校验 chatgpt-plugin/ 后端 JS 语法"
            node --check chatgpt-plugin/server.js || exit 1
            node --check chatgpt-plugin/test.js || exit 1
            echo "==> 校验 JSON/YAML 配置"
            node -e "for (const f of ['chatgpt-plugin/package.json','chatgpt-plugin/manifest.json','chatgpt-plugin/vercel.json']) JSON.parse(require('fs').readFileSync(f)); console.log('JSON OK')"
            echo "==> 全部模块语法通过"
        - name: build-web
          script: |
            set -e
            echo "==> 构建 Tauri Web 前端"
            npm --prefix tauri run build
            test -d tauri/src && echo "==> 前端产物已生成到 tauri/src"
        - name: 同步到 GitHub（含 Release Tag）
          script: |
            set -e
            command -v git >/dev/null 2>&1 || { echo "==> 镜像缺少 git，安装中"; apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1; }
            echo "==> 配置 GitHub 认证（不打印 token）"
            git config --global credential.helper '!f() { echo "username=yasuo22"; echo "password=${GITHUB_SYNC_TOKEN}"; }; f'
            git remote remove github 2>/dev/null || true
            git remote add github https://github.com/yasuo22/devpet.git
            echo "==> 同步 main 分支到 GitHub"
            git fetch github main 2>&1 || true
            if git push github main 2>&1; then
              echo "==> main 推送成功"
            else
              echo "==> main 分叉，合并 GitHub 侧提交后重试"
              git merge github/main --no-edit -m "Merge GitHub main (同步)" 2>&1
              git push github main 2>&1
              echo "==> main 合并推送成功"
            fi
            echo "==> 获取 CNB 侧 Release Tag"
            git fetch origin --tags 2>&1 || true
            echo "==> 同步所有 Release Tag 到 GitHub"
            git push --tags github 2>&1
            echo "==> 同步完成"
        - name: 同步 chatgpt-plugin 到 GitHub 独立仓库
          script: |
            set -e
            command -v git >/dev/null 2>&1 || { echo "==> 镜像缺少 git，安装中"; apt-get update -qq && apt-get install -y -qq git >/dev/null 2>&1; }
            command -v curl >/dev/null 2>&1 || { echo "==> 镜像缺少 curl，安装中"; apt-get update -qq && apt-get install -y -qq curl >/dev/null 2>&1; }
            echo "==> 配置 GitHub 认证（不打印 token）"
            git config --global credential.helper '!f() { echo "username=yasuo22"; echo "password=${GITHUB_SYNC_TOKEN}"; }; f'

            # 目标仓库（正确目标）
            GH_OWNER=yasuo22
            GH_TARGET=chatgpt-petplugin
            GH_OLD=devpet-chatgpt-plugin
            GH_URL="https://github.com/${GH_OWNER}/${GH_TARGET}.git"
            GH_API="https://api.github.com/repos/${GH_OWNER}/${GH_TARGET}"

            echo "==> [1/4] 删除 GitHub 上之前推送的分支/旧仓库残留"
            # 旧目标仓库（如果存在）—— 删除其 main 分支，避免残留误导
            OLD_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${GH_OWNER}/${GH_OLD})
            if [ "$OLD_CODE" = "200" ]; then
              echo "==> 删除旧仓库 ${GH_OWNER}/${GH_OLD} 的 main 分支"
              git push "https://yasuo22:${GITHUB_SYNC_TOKEN}@github.com/${GH_OWNER}/${GH_OLD}.git" --delete main 2>&1 || echo "==> 旧仓库 main 分支删除失败或不存在"
            else
              echo "==> 旧仓库 ${GH_OWNER}/${GH_OLD} 不存在（${OLD_CODE}），无需删除"
            fi
            # 新目标仓库（如果已存在）—— 清空 main 分支，重新推送
            CODE=$(curl -s -o /dev/null -w "%{http_code}" ${GH_API})
            if [ "$CODE" = "200" ]; then
              echo "==> 目标仓库 ${GH_OWNER}/${GH_TARGET} 已存在，删除其 main 分支以重新推送"
              git push "https://yasuo22:${GITHUB_SYNC_TOKEN}@github.com/${GH_OWNER}/${GH_TARGET}.git" --delete main 2>&1 || echo "==> 目标仓库 main 分支删除失败或不存在"
            else
              echo "==> 目标仓库 ${GH_OWNER}/${GH_TARGET} 尚不存在（${CODE}），准备创建"
              curl -s -X POST -H "Authorization: token ${GITHUB_SYNC_TOKEN}" \
                https://api.github.com/user/repos \
                -d "{\"name\":\"${GH_TARGET}\",\"private\":false,\"description\":\"DevPet ChatGPT 插件（独立项目）\"}" || true
            fi

            echo "==> [2/4] 将 chatgpt-plugin/ 目录作为独立仓库提交"
            cd chatgpt-plugin
            rm -rf .git
            git init -q
            git config user.email "cnb@cnb.cool"
            git config user.name "CNB Sync"
            git add -A
            git commit -q -m "chore: 同步 chatgpt-plugin 独立项目到 github.com/yasuo22/chatgpt-petplugin"

            echo "==> [3/4] 确认目标仓库已就绪"
            for i in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" ${GH_API})
              echo "==> 检查 ${GH_OWNER}/${GH_TARGET}: ${CODE}"
              [ "$CODE" = "200" ] && break
              sleep 2
            done

            echo "==> [4/4] 推送 chatgpt-plugin 到 GitHub main 分支"
            git push "https://yasuo22:${GITHUB_SYNC_TOKEN}@github.com/${GH_OWNER}/${GH_TARGET}.git" HEAD:main 2>&1 || echo "==> 推送失败，请确认 GitHub 仓库 ${GH_OWNER}/${GH_TARGET} 已创建且 token 具备 repo 权限"
            echo "==> chatgpt-plugin 同步完成"

            # 最后清理 git 全局 credential helper 配置，避免残留
            git config --global --unset credential.helper 2>/dev/null || true
  pull_request:
    - name: devpet-build
      runner:
        cpus: 4
      docker:
        image: node:20
      stages:
        - name: install
          script: |
            set -e
            npm --prefix tauri install --no-audit --no-fund
        - name: syntax-check
          script: |
            set -e
            echo "==> 校验 devpet/ 静态模块 JS 语法"
            for f in devpet/js/*.js; do
              node --check "$f" || exit 1
            done
            echo "==> 全部模块语法通过"
        - name: build-web
          script: |
            set -e
            echo "==> 构建 Tauri Web 前端"
            npm --prefix tauri run build
            test -d tauri/src && echo "==> 前端产物已生成到 tauri/src"
