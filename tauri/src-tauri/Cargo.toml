[package]
name = "devpet"
version = "1.1.0"
description = "DevPet · 开发者桌面宠物（Tauri 2 桌面壳）"
authors = ["uzi999"]
edition = "2021"

# 默认只构建桌面端（移除移动端相关 feature 以加快编译）
[lib]
name = "devpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
