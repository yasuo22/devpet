<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPet · 开发者桌面宠物</title>
  <link rel="icon" type="image/svg+xml" href="../devpet/assets/favicon.svg" />
  <link rel="stylesheet" href="../devpet/css/style.css" />
  <link rel="stylesheet" href="./tauri.css" />
</head>
<body>
  <!-- ===== 吉祥物 ===== -->
  <div id="mascot" class="mascot" role="img" aria-label="DevPet 开发者宠物">
    <div id="mascot-face" class="mascot-face">
      <svg id="mascot-svg" viewBox="0 0 96 96" aria-hidden="true">
        <!-- 身体 -->
        <ellipse class="body" cx="48" cy="54" rx="34" ry="32" />
        <!-- 耳朵 -->
        <ellipse class="ear left" cx="28" cy="30" rx="10" ry="14" />
        <ellipse class="ear right" cx="68" cy="30" rx="10" ry="14" />
        <!-- 眼睛 -->
        <circle class="eye left" cx="38" cy="48" r="5" />
        <circle class="eye right" cx="58" cy="48" r="5" />
        <!-- 眼睛高光 -->
        <circle class="glint left" cx="40" cy="46" r="1.6" />
        <circle class="glint right" cx="60" cy="46" r="1.6" />
        <!-- 腮红 -->
        <circle class="blush left" cx="30" cy="58" r="4" />
        <circle class="blush right" cx="66" cy="58" r="4" />
        <!-- 嘴巴 -->
        <path class="mouth" d="M42 62 Q48 68 54 62" />
        <!-- 状态装饰（雨伞/爱心/Zzz 等由 JS 动态插入） -->
      </svg>
    </div>
    <!-- 心情泡泡 -->
    <div id="mood-bubble" class="mood-bubble" hidden></div>
  </div>

  <!-- ===== 吉祥物控制栏 ===== -->
  <div id="mascot-controls" class="mascot-controls">
    <button id="btn-lock" class="ctrl-btn" title="锁定/解锁位置">🔒</button>
    <button id="btn-like" class="ctrl-btn" title="点赞">❤️</button>
    <button id="btn-wake" class="ctrl-btn" title="唤醒">🔔</button>
    <button id="btn-settings" class="ctrl-btn" title="宠物编辑器 / 设置">⚙️</button>
    <button id="btn-theme" class="ctrl-btn" title="切换主题">🌓</button>
    <!-- 桌面壳专属：点击穿透（仅 Tauri 环境显示） -->
    <button id="btn-click-through" class="ctrl-btn tauri-only" title="点击穿透（鼠标穿透窗口）">🎯</button>
    <!-- 桌面壳专属：置顶切换（仅 Tauri 环境显示） -->
    <button id="btn-top" class="ctrl-btn tauri-only" title="切换置顶">📌</button>
  </div>

  <!-- ===== 设置 / 宠物编辑器面板 ===== -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-card">
      <div class="settings-head">
        <strong>宠物编辑器 · 设置</strong>
        <button id="btn-close-settings" class="widget-close" title="关闭">✕</button>
      </div>

      <div id="pet-preview" class="pet-preview" title="预览当前宠物">
        <svg id="pet-preview-svg" viewBox="0 0 96 96" aria-hidden="true">
          <ellipse class="body" cx="48" cy="54" rx="34" ry="32" />
          <ellipse class="ear left" cx="28" cy="30" rx="10" ry="14" />
          <ellipse class="ear right" cx="68" cy="30" rx="10" ry="14" />
          <circle class="eye left" cx="38" cy="48" r="5" />
          <circle class="eye right" cx="58" cy="48" r="5" />
          <circle class="blush left" cx="30" cy="58" r="4" />
          <circle class="blush right" cx="66" cy="58" r="4" />
          <path class="mouth" d="M42 62 Q48 68 54 62" />
        </svg>
      </div>

      <label class="field">
        <span>宠物名称</span>
        <input id="input-pet-name" type="text" placeholder="DevPet" />
      </label>
      <label class="field">
        <span>性别</span>
        <select id="input-pet-gender">
          <option value="other">其他 / 无性</option>
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </label>
      <label class="field">
        <span>职业</span>
        <input id="input-pet-occupation" type="text" placeholder="开发者伙伴" />
      </label>
      <label class="field">
        <span>性格</span>
        <input id="input-pet-personality" type="text" placeholder="开朗" />
      </label>
      <div class="field">
        <span>宠物配色</span>
        <div class="color-row">
          <label class="color-item">
            <span>主体</span>
            <input id="input-pet-color-body" type="color" value="#ffd88f" />
          </label>
          <label class="color-item">
            <span>描边/暗色</span>
            <input id="input-pet-color-dark" type="color" value="#f0b866" />
          </label>
        </div>
      </div>
      <label class="field">
        <span>GitHub 用户名</span>
        <input id="input-github-user" type="text" placeholder="octocat" />
      </label>
      <div class="btn-row" style="justify-content:flex-end">
        <button id="btn-reset-pet" class="btn">恢复默认</button>
        <button id="btn-save-settings" class="btn primary">保存</button>
      </div>
      <div id="settings-msg" class="sub"></div>

      <!-- ===== 主题市场（多宠物） ===== -->
      <details class="hub-section" open>
        <summary>🎨 主题市场（多宠物）</summary>
        <div class="preset-grid" id="preset-grid"></div>
        <div class="btn-row">
          <button id="btn-export-pet" class="btn">⬇️ 导出配置</button>
          <button id="btn-import-pet" class="btn">⬆️ 导入配置</button>
          <input id="file-import-pet" type="file" accept=".json,application/json" hidden />
        </div>
        <div id="theme-msg" class="sub"></div>
      </details>

      <!-- ===== 通知服务 ===== -->
      <details class="hub-section">
        <summary>🔔 通知服务（Webhook）</summary>
        <label class="field">
          <span>Discord Webhook URL</span>
          <input id="input-webhook-discord" type="url" placeholder="https://discord.com/api/webhooks/..." />
        </label>
        <label class="field">
          <span>Slack Webhook URL</span>
          <input id="input-webhook-slack" type="url" placeholder="https://hooks.slack.com/services/..." />
        </label>
        <label class="field">
          <span>Telegram Bot API URL</span>
          <input id="input-webhook-telegram" type="url" placeholder="https://api.telegram.org/bot<TOKEN>/sendMessage?..." />
        </label>
        <div class="btn-row" style="justify-content:flex-end">
          <button id="btn-save-webhooks" class="btn primary">保存 Webhook</button>
          <button id="btn-test-webhook" class="btn">发送测试</button>
        </div>
        <div id="notify-msg" class="sub"></div>
      </details>

      <!-- ===== 协作模式 ===== -->
      <details class="hub-section">
        <summary>🤝 协作模式</summary>
        <label class="field">
          <span>在线状态</span>
          <select id="input-collab-status">
            <option value="online">🟢 在线 · 可协作</option>
            <option value="busy">🔴 协作中</option>
            <option value="away">🟡 离开</option>
          </select>
        </label>
        <label class="field">
          <span>当前项目</span>
          <input id="input-collab-project" type="text" placeholder="DevPet" />
        </label>
        <label class="field">
          <span>正在编辑文件（可选）</span>
          <input id="input-collab-file" type="text" placeholder="src/app.js" />
        </label>
        <label class="field">
          <span>队友昵称（可选）</span>
          <input id="input-collab-teammate" type="text" placeholder="Bob" />
        </label>
        <div class="btn-row" style="justify-content:flex-end">
          <button id="btn-save-collab" class="btn primary">更新状态</button>
          <button id="btn-copy-invite" class="btn">复制邀请链接</button>
        </div>
        <div id="collab-msg" class="sub"></div>
      </details>
    </div>
  </div>

  <!-- ===== Widget 面板 ===== -->
  <main id="dashboard" class="dashboard">
    <!-- 每个 Widget 由 widgets.js 动态注入 -->
  </main>

  <!-- ===== 社交层 ===== -->
  <div id="social-layer" class="social-layer" hidden></div>

  <!-- ===== 模块脚本 ===== -->
  <!-- 复用 Web 版 DevPet 全部逻辑 -->
  <script type="module" src="../devpet/js/app.js"></script>
  <!-- Tauri 桌面壳桥接层（检测环境 + 原生能力绑定） -->
  <script type="module" src="./tauri.js"></script>
</body>
</html>
