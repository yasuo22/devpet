<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevPet · 开发者桌面宠物</title>
  <link rel="icon" type="image/svg+xml" href="../devpet/assets/favicon.svg" />
  <link rel="stylesheet" href="../devpet/css/style.css" />
  <link rel="stylesheet" href="./tauri.css" />
</head>
<body>
  <!-- ===== 吉祥物 ===== -->
  <div id="mascot" class="mascot" role="img" aria-label="DevPet 开发者宠物">
    <div id="mascot-face" class="mascot-face">
      <svg id="mascot-svg" viewBox="0 0 96 96" aria-hidden="true">
        <!-- 身体 -->
        <ellipse class="body" cx="48" cy="54" rx="34" ry="32" />
        <!-- 耳朵 -->
        <ellipse class="ear left" cx="28" cy="30" rx="10" ry="14" />
        <ellipse class="ear right" cx="68" cy="30" rx="10" ry="14" />
        <!-- 眼睛 -->
        <circle class="eye left" cx="38" cy="48" r="5" />
        <circle class="eye right" cx="58" cy="48" r="5" />
        <!-- 眼睛高光 -->
        <circle class="glint left" cx="40" cy="46" r="1.6" />
        <circle class="glint right" cx="60" cy="46" r="1.6" />
        <!-- 腮红 -->
        <circle class="blush left" cx="30" cy="58" r="4" />
        <circle class="blush right" cx="66" cy="58" r="4" />
        <!-- 嘴巴 -->
        <path class="mouth" d="M42 62 Q48 68 54 62" />
        <!-- 状态装饰（雨伞/爱心/Zzz 等由 JS 动态插入） -->
      </svg>
    </div>
    <!-- 心情泡泡 -->
    <div id="mood-bubble" class="mood-bubble" hidden></div>
  </div>

  <!-- ===== 吉祥物控制栏 ===== -->
  <div id="mascot-controls" class="mascot-controls">
    <button id="btn-lock" class="ctrl-btn" title="锁定/解锁位置">🔒</button>
    <button id="btn-like" class="ctrl-btn" title="点赞">❤️</button>
    <button id="btn-wake" class="ctrl-btn" title="唤醒">🔔</button>
    <button id="btn-settings" class="ctrl-btn" title="设置 / 关联 GitHub">⚙️</button>
    <!-- 桌面壳专属：点击穿透（仅 Tauri 环境显示） -->
    <button id="btn-click-through" class="ctrl-btn tauri-only" title="点击穿透（鼠标穿透窗口）">🎯</button>
    <!-- 桌面壳专属：置顶切换（仅 Tauri 环境显示） -->
    <button id="btn-top" class="ctrl-btn tauri-only" title="切换置顶">📌</button>
  </div>

  <!-- ===== 设置面板 ===== -->
  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-card">
      <div class="settings-head">
        <strong>设置 · 关联 GitHub</strong>
        <button id="btn-close-settings" class="widget-close" title="关闭">✕</button>
      </div>
      <label class="field">
        <span>宠物名称</span>
        <input id="input-pet-name" type="text" placeholder="DevPet" />
      </label>
      <label class="field">
        <span>职业</span>
        <input id="input-pet-occupation" type="text" placeholder="开发者伙伴" />
      </label>
      <label class="field">
        <span>GitHub 用户名</span>
        <input id="input-github-user" type="text" placeholder="octocat" />
      </label>
      <div class="btn-row" style="justify-content:flex-end">
        <button id="btn-save-settings" class="btn primary">保存</button>
      </div>
      <div id="settings-msg" class="sub"></div>
    </div>
  </div>

  <!-- ===== Widget 面板 ===== -->
  <main id="dashboard" class="dashboard">
    <!-- 每个 Widget 由 widgets.js 动态注入 -->
  </main>

  <!-- ===== 社交层 ===== -->
  <div id="social-layer" class="social-layer" hidden></div>

  <!-- ===== 模块脚本 ===== -->
  <!-- 复用 Web 版 DevPet 全部逻辑 -->
  <script type="module" src="../devpet/js/app.js"></script>
  <!-- Tauri 桌面壳桥接层（检测环境 + 原生能力绑定） -->
  <script type="module" src="./tauri.js"></script>
</body>
</html>
